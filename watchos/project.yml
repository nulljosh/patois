name: PatoisWatch
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    watchOS: "10.0"
settings:
  DEVELOPMENT_TEAM: QMM486NPYC
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
targets:
  PatoisWatch:
    type: application
    platform: watchOS
    sources:
      - PatoisWatchApp.swift
      - ContentView.swift
      - Models
      - Views
      - Settings
      - Assets.xcassets
    settings:
      INFOPLIST_FILE: ""
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.lingo.watchos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: Patois
